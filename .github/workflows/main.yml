name: Build and Test
permissions:
  contents: read

on:
  push:
    branches:
      - main
    tags:
      - "v*"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup build agent
        run: ./.github/scripts/setup.sh

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install PyYAML

      - name: Validate manifest categories
        run: python3 .github/scripts/check-categories.py

      - name: Find last successful build
        id: lastsuccess
        uses: SamhammerAG/last-successful-build-action@v8
        with:
          branch: "main"
          workflow: "Build and Test"
          verify: true
          token: "${{ secrets.GITHUB_TOKEN }}"

      - name: Determine targets
        id: targets
        run: ./.github/scripts/determine-targets.sh
        env:
          BASE_SHA: ${{ steps.lastsuccess.outputs.sha }}
          HEAD_SHA: ${{ github.sha }}

      - name: Check modified apps
        run: ./.github/scripts/check-apps.sh
        env:
          TARGETS: "${{ steps.targets.outputs.targets }}"
