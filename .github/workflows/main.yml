name: Build and Test
permissions:
  contents: read

on:
  push:
    branches:
      - main
    tags:
      - "v*"

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # Default (unset): catch-up since last successful main build.
      # Set repo variable PIXLET_CHECK_ONLY_LAST_PUSH=true to pixlet-check only apps
      # with .star changes in this push (no catch-up).
      PIXLET_CHECK_ONLY_LAST_PUSH: ${{ vars.PIXLET_CHECK_ONLY_LAST_PUSH || 'false' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup build agent
        run: ./.github/scripts/setup.sh

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install PyYAML

      - name: Validate manifest categories
        run: python3 .github/scripts/check-categories.py

      - name: Find last successful build
        id: lastsuccess
        if: env.PIXLET_CHECK_ONLY_LAST_PUSH != 'true'
        uses: SamhammerAG/last-successful-build-action@v8
        with:
          branch: "main"
          workflow: "Build and Test"
          verify: true
          token: "${{ secrets.GITHUB_TOKEN }}"

      - name: Determine targets
        id: targets
        env:
          EVENT_BEFORE: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          LAST_SUCCESS_SHA: ${{ steps.lastsuccess.outputs.sha }}
        run: |
          zero="0000000000000000000000000000000000000000"
          if [[ "${PIXLET_CHECK_ONLY_LAST_PUSH}" == "true" ]]; then
            echo "Pixlet target mode: PIXLET_CHECK_ONLY_LAST_PUSH"
            if [[ "${EVENT_BEFORE}" == "${zero}" ]]; then
              echo "No previous commit on branch; skipping pixlet check targets"
              echo "targets=" >> "${GITHUB_OUTPUT}"
            else
              BASE_SHA="${EVENT_BEFORE}" HEAD_SHA="${HEAD_SHA}" ./.github/scripts/determine-targets.sh
            fi
          else
            echo "Pixlet target mode: since last successful build"
            BASE_SHA="${LAST_SUCCESS_SHA}" HEAD_SHA="${HEAD_SHA}" ./.github/scripts/determine-targets.sh
          fi

      - name: Check modified apps
        run: ./.github/scripts/check-apps.sh
        env:
          TARGETS: "${{ steps.targets.outputs.targets }}"
